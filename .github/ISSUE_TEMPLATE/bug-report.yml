name: Bug Report
description: Signaler un bug reproductible avec contexte et impact.
title: "BUG: "
labels:
  - type: bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Résumé
      placeholder: Décrire clairement le bug observé.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat observé
    validations:
      required: true
  - type: input
    id: impacted_package
    attributes:
      label: Package impacté
      placeholder: "ex: gr-database, ui/datapad"
    validations:
      required: true
  - type: textarea
    id: db_ui_impact
    attributes:
      label: Impact DB / UI
      placeholder: "Décrire la portée sur la base, l'UI ou l'infra."
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priorité
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Sévérité
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true
