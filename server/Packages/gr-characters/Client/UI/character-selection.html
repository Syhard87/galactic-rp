<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Character Selection</title>
    <style>
        :root {
            --bg: #101417;
            --panel: rgba(20, 28, 32, 0.96);
            --panel-border: rgba(151, 178, 172, 0.34);
            --text: #edf2ee;
            --muted: #a9b7af;
            --field: #172025;
            --field-border: #3b4c4d;
            --accent: #c7e76c;
            --accent-dark: #8aa33d;
            --danger: #ff8170;
            --success: #8ee6a8;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: none;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 32px;
            background:
                linear-gradient(135deg, rgba(16, 20, 23, 0.92), rgba(30, 45, 45, 0.82)),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 64px);
            color: var(--text);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        body.is-open {
            display: flex;
        }

        main {
            width: min(780px, 100%);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 22px 80px rgba(0, 0, 0, 0.46);
        }

        header {
            padding: 24px 28px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.45;
        }

        .content {
            display: grid;
            gap: 16px;
            padding: 24px 28px 28px;
        }

        .characters {
            display: grid;
            gap: 12px;
        }

        .character-option {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            border: 1px solid var(--field-border);
            border-radius: 8px;
            background: var(--field);
            padding: 16px;
        }

        .identity {
            display: grid;
            gap: 5px;
            min-width: 0;
        }

        .name {
            color: var(--text);
            font-size: 18px;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .meta {
            color: var(--muted);
            font-size: 14px;
        }

        button {
            min-width: 150px;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #15190e;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            padding: 12px 16px;
        }

        button:disabled {
            background: var(--accent-dark);
            cursor: wait;
            opacity: 0.72;
        }

        .message {
            min-height: 22px;
            color: var(--muted);
            font-size: 14px;
        }

        .message.error {
            color: var(--danger);
        }

        .message.success {
            color: var(--success);
        }

        @media (max-width: 620px) {
            body {
                padding: 16px;
            }

            header,
            .content {
                padding-left: 18px;
                padding-right: 18px;
            }

            .character-option {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Select Character</h1>
            <p>Choose the identity you want to play. The server validates ownership before activation.</p>
        </header>

        <section class="content">
            <div id="characters" class="characters"></div>
            <div id="message" class="message"></div>
        </section>
    </main>

    <script>
        const charactersContainer = document.getElementById("characters");
        const message = document.getElementById("message");
        let selectedCharacterId = null;

        function setMessage(text, kind) {
            message.textContent = text || "";
            message.className = "message" + (kind ? " " + kind : "");
        }

        function setButtonsEnabled(isEnabled) {
            document.querySelectorAll("button[data-character-id]").forEach(function(button) {
                button.disabled = !isEnabled;
            });
        }

        function textOrFallback(value, fallback) {
            if (value === null || value === undefined || String(value).trim() === "") {
                return fallback;
            }

            return String(value);
        }

        function formatCharacterMeta(character) {
            const age = textOrFallback(character.age, "unknown age");
            const species = textOrFallback(character.species, "unknown species");
            return age + " years - " + species;
        }

        function renderCharacters(characters) {
            charactersContainer.innerHTML = "";

            if (!Array.isArray(characters) || characters.length === 0) {
                setMessage("No selectable character returned by the server.", "error");
                return;
            }

            characters.forEach(function(character) {
                const option = document.createElement("article");
                option.className = "character-option";

                const identity = document.createElement("div");
                identity.className = "identity";

                const name = document.createElement("div");
                name.className = "name";
                name.textContent = textOrFallback(character.first_name, "Unknown") + " " + textOrFallback(character.last_name, "");

                const meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = formatCharacterMeta(character);

                const button = document.createElement("button");
                button.type = "button";
                button.textContent = "Select";
                button.dataset.characterId = character.id;
                button.addEventListener("click", function() {
                    selectedCharacterId = character.id;
                    setButtonsEnabled(false);
                    setMessage("Selecting character...", "");
                    Events.Call("SubmitCharacterSelection", selectedCharacterId);
                });

                identity.appendChild(name);
                identity.appendChild(meta);
                option.appendChild(identity);
                option.appendChild(button);
                charactersContainer.appendChild(option);
            });
        }

        Events.Subscribe("OpenCharacterSelection", function(payload) {
            document.body.classList.add("is-open");
            selectedCharacterId = null;
            setButtonsEnabled(true);
            setMessage("Select a character to enter gameplay.", "");
            renderCharacters(payload && payload.characters);
        });

        Events.Subscribe("CharacterSelectionResult", function(result) {
            setButtonsEnabled(true);

            if (result && result.success === true) {
                setButtonsEnabled(false);
                setMessage("Character selected. Entering gameplay...", "success");
                window.setTimeout(function() {
                    Events.Call("CloseCharacterSelection");
                }, 900);
                return;
            }

            selectedCharacterId = null;
            setMessage(result && result.code ? result.code : "Character selection failed.", "error");
        });

        Events.Call("Ready");
    </script>
</body>
</html>
